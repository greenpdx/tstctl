[workspace]

[package]
name = "testctl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "testctl-master"
path = "src/bin/master.rs"

[[bin]]
name = "testctl-remote"
path = "src/bin/remote.rs"

[lib]
name = "testctl"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }

# Network
socket2 = "0.5"
nix = { version = "0.29", features = ["socket", "net", "ioctl"] }
hostname = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
